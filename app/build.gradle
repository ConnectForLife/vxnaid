apply plugin: 'com.android.application'
apply plugin: 'kotlin-android'
apply plugin: 'kotlin-kapt'
apply plugin: 'com.google.devtools.ksp'
apply plugin: 'org.jetbrains.kotlin.plugin.parcelize'
apply plugin: 'io.gitlab.arturbosch.detekt'
apply plugin: 'org.jetbrains.dokka'

// Version
ext.versionMajor = 3
ext.versionMinor = 2
ext.versionPatch = 0

// Iris scanner variables
def productRootDir = "./"
def productBinDir = new File(productRootDir, "bin")
def productLibAndroidDir = new File(productRootDir, "libs")
def archUsed = "armeabi-v7a,arm64-v8a,x86,x86_64"
def usedNdfList = ["Irises.ndf"]

android {

    packagingOptions {
        exclude 'member-search-index.zip'
        exclude 'jquery-ui.overrides.css'
        exclude 'jquery/jquery-ui.min.css'
        exclude 'index-all.html'
        exclude 'jquery/jszip/dist/jszip.min.js'
        exclude 'package-search-index.js'
        exclude 'allclasses-index.html'
        exclude 'index.html'
        exclude 'member-search-index.js'
        exclude 'jquery/external/jquery/jquery.js'
        exclude 'stylesheet.css'
        exclude 'com/neurotec/devices/fscanners/futronic/package-use.html'
        exclude 'allpackages-index.html'
        exclude 'help-doc.html'
        exclude 'constant-values.html'
        exclude 'legal/pako.md'
        exclude 'jquery/jquery-ui.min.js'
        exclude 'legal/jqueryUI.md'
        exclude 'overview-tree.html'
        exclude 'jquery/jszip/dist/jszip.js'
        exclude 'com/neurotec/devices/fscanners/futronic/package-tree.html'
        exclude 'allclasses.html'
        exclude 'legal/jquery.md'
        exclude 'type-search-index.zip'
        exclude 'type-search-index.js'
        exclude 'jquery/jszip-utils/dist/jszip-utils.js'
        exclude 'search.js'
        exclude 'resources/glass.png'
        exclude 'element-list'
        exclude 'jquery/jszip-utils/dist/jszip-utils-ie.js'
        exclude 'jquery/jszip-utils/dist/jszip-utils-ie.min.js'
        exclude 'legal/ASSEMBLY_EXCEPTION'
        exclude 'jquery/jquery-3.6.1.min.js'
        exclude 'serialized-form.html'
        exclude 'package-search-index.zip'
        exclude 'deprecated-list.html'
        exclude 'legal/jszip.md'
        exclude 'com/neurotec/devices/fscanners/futronic/package-summary.html'
        exclude 'jquery/jszip-utils/dist/jszip-utils.min.js'
        exclude 'overview-summary.html'
        exclude 'script.js'
        exclude 'resources/x.png'
    }
    namespace = "com.jnj.vaccinetracker"
    compileSdkVersion config.buildConfig.compileSdkVersion

    defaultConfig {
        applicationId "com.jnj.vaccinetracker"
        minSdkVersion config.buildConfig.minSdkVersion
        targetSdkVersion config.buildConfig.targetSdkVersion
        ksp {
            arg("room.schemaLocation", "$projectDir/schemas")
            arg("room.incremental", "true")
        }
        kapt {
            correctErrorTypes = true
            useBuildCache = true
        }
        versionCode generateVersionCode()
        versionName generateVersionName()
        setProperty("archivesBaseName", "VMP-$versionName")
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
    }

    signingConfigs {
        release {
            storeFile file("../support/keystore.jks")
            storePassword "SOLIDARITY_STORE_PASSWORD"
            keyAlias 'releaseKey'
            keyPassword "SOLIDARITY_KEY_PASSWORD"
        }
    }

    testOptions {
        unitTests {
            all {
                useJUnitPlatform()
            }
            includeAndroidResources = true
        }
    }

    buildTypes {
        release {
            //minifyEnabled true
            //proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.pro'
            signingConfig signingConfigs.release
            ndk {
                abiFilters 'armeabi-v7a','arm64-v8a'
               // abiFilters "armeabi-v7a","arm64-v8a","x86","x86_64"
            }
        }
        debug {
            ndk {
               abiFilters 'armeabi-v7a','arm64-v8a'
               // abiFilters "armeabi-v7a","arm64-v8a","x86","x86_64"
            }
            versionNameSuffix "-debug"
            debuggable true
        }
        mockBackend {
            initWith debug
            versionNameSuffix "-mockBackend"
            applicationIdSuffix ".mock"
        }
    }

    // Product flavors for how updates are to be made to the app
    flavorDimensions "updates"
    productFlavors {
        MDM {
            // App updates will be pushed through an MDM tool
            dimension "updates"
            applicationIdSuffix ".MDM"
            versionNameSuffix "-MDM"
        }
        manual {
            // App updates will be checked and downloaded through the application itself
            dimension "updates"
        }
    }

    buildFeatures {
        dataBinding true
        buildConfig = true
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    kotlinOptions {
        jvmTarget = "17"
    }

    aaptOptions {
        noCompress "tflite"
    }

    sourceSets {
        // Encapsulates configurations for the main source set.
        release {
            java.srcDirs = ['src/debug/java']
            res.srcDirs = ['src/debug/res']
            manifest.srcFile 'src/debug/AndroidManifest.xml'
        }
        androidTest.java.srcDirs += 'src/androidTest/kotlin'
        androidTest.java.srcDirs += [file("$buildDir/generated/source/ksp/androidTest")]
        androidTest.java.srcDirs += [file("$buildDir/generated/source/kspKotlin/androidTest")]
    }
}

kapt {
    correctErrorTypes = true
}

dependencies {
    implementation fileTree(dir: 'libs', include: ['*.jar'])
    implementation 'androidx.legacy:legacy-support-v4:1.0.0'
    implementation 'androidx.lifecycle:lifecycle-livedata-ktx:2.3.1'
    implementation 'androidx.lifecycle:lifecycle-viewmodel-ktx:2.3.1'
    implementation 'com.google.code.gson:gson:2.10.1'
    implementation 'org.apache.poi:poi:3.17'
    implementation 'com.google.zxing:core:3.4.1'
    implementation 'com.journeyapps:zxing-android-embedded:4.3.0'
    implementation "com.google.android.material:material:1.9.0"
    deps.implementation.each { name, dep ->
        implementation dep
    }

    deps.nonTransitiveImplementation.each { name, dep ->
        implementation(dep) { transitive = false }
    }

    deps.debugImplementation.each { name, dep ->
        debugImplementation dep
        mockBackendImplementation dep
    }

    deps.releaseImplementation.each { name, dep ->
        releaseImplementation dep
    }

    deps.annotationProcessors.each { name, dep ->
        ksp dep
    }

    deps.androidTestAnnotationProcessors.each { name, dep ->
        kspAndroidTest dep
    }

    deps.testImplementation.each { name, dep ->
        testImplementation dep
    }
    deps.androidTestImplementation.each { name, dep ->
        androidTestImplementation dep
    }
}

@SuppressWarnings('GrMethodMayBeStatic')
private Integer generateVersionCode() {
    return ext.versionMajor * 10000 + ext.versionMinor * 100 + ext.versionPatch
}

@SuppressWarnings('GrMethodMayBeStatic')
private String generateVersionName() {
    return "${ext.versionMajor}.${ext.versionMinor}.${ext.versionPatch}"
}

tasks.register("detektCheck") {
    dependsOn tasks.named("detekt")
}

// Tasks for Iris scanner
// ----------------------
// Remove previous ndf files from assets
task deleteTemporaryFiles(type: Delete) {
    for (String file : usedNdfList) {
        delete "${android.sourceSets.main.assets.srcDirs[0]}/data/${file}.jet"
    }
    delete "${android.sourceSets.main.jniLibs.srcDirs[0]}"
}
// Copy over ndf file to assets
task prepareNdfFiles(type: Copy) {
    from "${productBinDir}/data"
    includes = usedNdfList
    rename { String fileName ->
        fileName.replace('.ndf', '.ndf.jet')
    }
    into "${android.sourceSets.main.assets.srcDirs[0]}/data"
}
// Copy libs files to jnilibs directory
int counter = 1
archUsed.split(',').each {
    String srcDir = "${productLibAndroidDir}/${it}"
    String dstDir = "${android.sourceSets.main.jniLibs.srcDirs[0]}/${it}"
    task "prepareNativeLibs$counter"(type: Copy) {
        from srcDir
        exclude "**/libgstreamer_android.so"
        exclude "**/*.Test.so"
        exclude "**/*.IT.so"
        into dstDir
        dependsOn(prepareNdfFiles)
    }
    tasks.preBuild.dependsOn("prepareNativeLibs$counter")
    counter++
}
prepareNdfFiles.dependsOn(deleteTemporaryFiles)

dokka {
    outputFormat = 'gfm' // use 'javadoc' to get standard java docs
    outputDirectory = "../docs/kdoc"
    skipEmptyPackages = true
    skipDeprecated = true
    reportUndocumented = true
    includeNonPublic = false
}
